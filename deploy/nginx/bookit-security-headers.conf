map $request_uri $bookit_frontend_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'";
    ~^/api(/|$) "";
}

map $uri $bookit_cache_control {
    default "";
    / "no-store";
    /robots.txt "no-store";
    /sitemap.xml "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

map $bookit_cache_control $bookit_cache_pragma {
    default "";
    no-store "no-cache";
}

map $bookit_cache_control $bookit_cache_expires {
    default "";
    no-store "0";
}

server_tokens off;

add_header Content-Security-Policy $bookit_frontend_csp always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control $bookit_cache_control always;
add_header Pragma $bookit_cache_pragma always;
add_header Expires $bookit_cache_expires always;
