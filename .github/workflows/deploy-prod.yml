name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Optional commit SHA. Leave blank to auto-select the latest commit on main that passed staging validation.
        required: false
        type: string

jobs:
  validate:
    name: Validate Promotion
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.verify_main.outputs.target_sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve target commit SHA
        id: resolve_sha
        uses: actions/github-script@v7
        env:
          INPUT_SHA: ${{ inputs.sha }}
        with:
          script: |
            const inputSha = (process.env.INPUT_SHA || '').trim();
            const { owner, repo } = context.repo;
            const requiredJobs = [
              {
                label: 'Performance SIT (k6)',
                matches: (name) => name === 'Performance SIT (k6)',
              },
              {
                label: 'Deploy to Staging',
                matches: (name) => name === 'Deploy to Staging',
              },
              {
                label: 'Performance Staging (Hosted)',
                matches: (name) =>
                  name === 'Hosted Staging Performance Gate'
                  || (
                    name.includes('Performance Staging (Hosted)')
                    && name.includes('Hosted Staging Performance Gate')
                  ),
              },
              {
                label: 'OWASP ZAP (DAST)',
                matches: (name) =>
                  name === 'OWASP ZAP Baseline Scan'
                  || (
                    name.includes('OWASP ZAP (DAST)')
                    && name.includes('OWASP ZAP Baseline Scan')
                  ),
              },
            ];

            async function runPassedStagingValidation(runId) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });

              for (const requiredJob of requiredJobs) {
                const job = jobs.find((candidate) => requiredJob.matches(candidate.name));

                if (!job) {
                  return {
                    ok: false,
                    reason: `missing required job '${requiredJob.label}'`,
                  };
                }

                if (job.conclusion !== 'success') {
                  return {
                    ok: false,
                    reason: `job '${job.name}' concluded with '${job.conclusion}'`,
                  };
                }
              }

              return { ok: true };
            }

            if (inputSha) {
              core.info(`Using manually provided SHA: ${inputSha}`);
              core.setOutput('target_sha', inputSha);
              return;
            }

            core.info('No SHA provided, selecting latest successful Deploy to Staging run on main that passed all staging validation jobs.');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'cd.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });

            const successful = runs.data.workflow_runs
              .filter((run) => run.conclusion === 'success')
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));

            for (const run of successful) {
              const validation = await runPassedStagingValidation(run.id);

              if (!validation.ok) {
                core.info(`Skipping Deploy to Staging run ${run.id} for ${run.head_sha}: ${validation.reason}.`);
                continue;
              }

              core.info(`Auto-selected SHA ${run.head_sha} from Deploy to Staging run ${run.id}.`);
              core.setOutput('target_sha', run.head_sha);
              return;
            }

            core.setFailed(
              'No successful Deploy to Staging runs found on main that passed Performance SIT, deploy, hosted staging performance, and DAST. Run staging validation first, or provide a SHA manually.',
            );

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested commit is on main
        id: verify_main
        env:
          TARGET_SHA: ${{ steps.resolve_sha.outputs.target_sha }}
        run: |
          git fetch origin main

          git cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null || {
            echo "Commit $TARGET_SHA was not found."
            exit 1
          }

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Commit $TARGET_SHA is not reachable from origin/main."
            exit 1
          fi

          FULL_SHA="$(git rev-parse "$TARGET_SHA^{commit}")"
          echo "Resolved commit to full SHA: $FULL_SHA"
          echo "target_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify staging validation gates passed for the requested commit
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.verify_main.outputs.target_sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const { owner, repo } = context.repo;
            const requiredJobs = [
              {
                label: 'Performance SIT (k6)',
                matches: (name) => name === 'Performance SIT (k6)',
              },
              {
                label: 'Deploy to Staging',
                matches: (name) => name === 'Deploy to Staging',
              },
              {
                label: 'Performance Staging (Hosted)',
                matches: (name) =>
                  name === 'Hosted Staging Performance Gate'
                  || (
                    name.includes('Performance Staging (Hosted)')
                    && name.includes('Hosted Staging Performance Gate')
                  ),
              },
              {
                label: 'OWASP ZAP (DAST)',
                matches: (name) =>
                  name === 'OWASP ZAP Baseline Scan'
                  || (
                    name.includes('OWASP ZAP (DAST)')
                    && name.includes('OWASP ZAP Baseline Scan')
                  ),
              },
            ];

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'cd.yml',
              head_sha: targetSha,
              status: 'completed',
              per_page: 100,
            });

            const successfulRuns = runs.data.workflow_runs
              .filter((run) => run.conclusion === 'success')
              .sort((left, right) => {
                if (left.run_number !== right.run_number) {
                  return right.run_number - left.run_number;
                }

                return new Date(right.created_at) - new Date(left.created_at);
              });

            if (successfulRuns.length === 0) {
              core.setFailed(
                `No successful Deploy to Staging run found for commit ${targetSha}. Promote only commits that passed staging validation.`,
              );
              return;
            }

            for (const run of successfulRuns) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });

              let failedRequirement = null;

              for (const requiredJob of requiredJobs) {
                const job = jobs.find((candidate) => requiredJob.matches(candidate.name));

                if (!job) {
                  failedRequirement = `missing required job '${requiredJob.label}'`;
                  break;
                }

                if (job.conclusion !== 'success') {
                  failedRequirement = `job '${job.name}' concluded with '${job.conclusion}'`;
                  break;
                }
              }

              if (!failedRequirement) {
                core.info(
                  `Validated Deploy to Staging run ${run.id} for commit ${targetSha} with all staging validation jobs successful.`,
                );
                return;
              }

              core.info(`Skipping Deploy to Staging run ${run.id} for ${targetSha}: ${failedRequirement}.`);
            }

            core.setFailed(
              `No successful Deploy to Staging run found for commit ${targetSha} with Performance SIT, deploy, hosted staging performance, and DAST all passing.`,
            );

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment: Production
    permissions:
      actions: read
      contents: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Setup Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.DEPLOY_API_URL }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure deploy directories exist on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST \
            "mkdir -p ~/BookIt/backend ~/BookIt/frontend ~/BookIt/deploy/nginx"

      - name: Copy backend to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/dist backend/package.json backend/package-lock.json backend/prisma \
            $EC2_USER@$EC2_HOST:~/BookIt/backend/

      - name: Copy frontend to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist frontend/package.json frontend/package-lock.json frontend/serve.json \
            $EC2_USER@$EC2_HOST:~/BookIt/frontend/

      - name: Copy nginx security config to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy/nginx/ \
            $EC2_USER@$EC2_HOST:~/BookIt/deploy/nginx/

      - name: Install deps and restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -f /swapfile ]; then
              echo "Adding 2GB swap for free-tier EC2..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap added."
            fi

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use default

            sudo mkdir -p /etc/nginx/conf.d
            sudo cp ~/BookIt/deploy/nginx/bookit-security-headers.conf /etc/nginx/conf.d/bookit-security-headers.conf
            sudo nginx -t
            sudo systemctl reload nginx

            cd ~/BookIt/backend
            npm ci --omit=dev
            npx --yes prisma generate
            pm2 delete bookit-api 2>/dev/null || true
            CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}" PORT=5173 pm2 start dist/src/main.js --name bookit-api

            cd ~/BookIt/frontend
            npm ci --omit=dev
            pm2 delete bookit-frontend 2>/dev/null || true
            pm2 start npx --name bookit-frontend -- --yes serve --config serve.json dist -l 3000

            pm2 save
            echo "Deploy complete."
