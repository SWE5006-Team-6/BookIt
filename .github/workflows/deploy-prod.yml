name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Optional commit SHA. Leave blank to auto-select latest successful staging+DAST candidate on main.
        required: false
        type: string

jobs:
  validate:
    name: Validate Promotion
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.verify_main.outputs.target_sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve target commit SHA
        id: resolve_sha
        uses: actions/github-script@v7
        env:
          INPUT_SHA: ${{ inputs.sha }}
        with:
          script: |
            const inputSha = (process.env.INPUT_SHA || '').trim();
            const { owner, repo } = context.repo;

            if (inputSha) {
              core.info(`Using manually provided SHA: ${inputSha}`);
              core.setOutput('target_sha', inputSha);
              return;
            }

            core.info('No SHA provided, selecting latest successful DAST run on main.');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'dast.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });

            const successful = runs.data.workflow_runs.filter(
              (run) => run.conclusion === 'success',
            );

            if (successful.length === 0) {
              core.setFailed(
                'No successful DAST runs found on main. Run staging deploy + DAST first, or provide a SHA manually.',
              );
              return;
            }

            const latest = successful.reduce((best, run) => {
              if (!best) return run;
              return new Date(run.created_at) > new Date(best.created_at) ? run : best;
            }, null);

            core.info(`Auto-selected SHA ${latest.head_sha} from DAST run ${latest.id}.`);
            core.setOutput('target_sha', latest.head_sha);

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested commit is on main
        id: verify_main
        env:
          TARGET_SHA: ${{ steps.resolve_sha.outputs.target_sha }}
        run: |
          git fetch origin main

          git cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null || {
            echo "Commit $TARGET_SHA was not found."
            exit 1
          }

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Commit $TARGET_SHA is not reachable from origin/main."
            exit 1
          fi

          FULL_SHA="$(git rev-parse "$TARGET_SHA^{commit}")"
          echo "Resolved commit to full SHA: $FULL_SHA"
          echo "target_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify staging DAST passed for the requested commit
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.verify_main.outputs.target_sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'dast.yml',
              head_sha: targetSha,
              status: 'completed',
              per_page: 100,
            });

            const workflowRuns = runs.data.workflow_runs;

            if (workflowRuns.length === 0) {
              core.setFailed(
                `No completed DAST run found for commit ${targetSha}. Promote only commits that completed staging deployment and DAST.`,
              );
              return;
            }

            const latestRun = workflowRuns.reduce((latest, run) => {
              if (!latest) {
                return run;
              }

              if (run.run_number !== latest.run_number) {
                return run.run_number > latest.run_number ? run : latest;
              }

              return new Date(run.created_at) > new Date(latest.created_at)
                ? run
                : latest;
            }, null);

            if (latestRun.conclusion !== 'success') {
              core.setFailed(
                `Latest completed DAST run ${latestRun.id} for commit ${targetSha} concluded with '${latestRun.conclusion}'. Promote only commits whose most recent completed DAST run succeeded.`,
              );
              return;
            }

            core.info(
              `Validated latest staging DAST run ${latestRun.id} for commit ${targetSha}.`,
            );

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment: Production
    permissions:
      actions: read
      contents: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Setup Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.DEPLOY_API_URL }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure deploy directories exist on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST \
            "mkdir -p ~/BookIt/backend ~/BookIt/frontend"

      - name: Copy backend to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/dist backend/package.json backend/package-lock.json backend/prisma \
            $EC2_USER@$EC2_HOST:~/BookIt/backend/

      - name: Copy frontend to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist frontend/package.json frontend/package-lock.json \
            $EC2_USER@$EC2_HOST:~/BookIt/frontend/

      - name: Install deps and restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -f /swapfile ]; then
              echo "Adding 2GB swap for free-tier EC2..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap added."
            fi

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use default

            cd ~/BookIt/backend
            npm ci --omit=dev
            npx --yes prisma generate
            pm2 delete bookit-api 2>/dev/null || true
            CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}" PORT=5173 pm2 start dist/src/main.js --name bookit-api

            cd ~/BookIt/frontend
            npm ci --omit=dev
            pm2 delete bookit-frontend 2>/dev/null || true
            pm2 start "npx serve dist -l 3000" --name bookit-frontend

            pm2 save
            echo "Deploy complete."
