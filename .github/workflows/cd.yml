name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to deploy
        required: true
        type: string
        default: main
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  backend-performance:
    name: Performance SIT (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookit_performance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookit_performance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookit_performance
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bookit_performance
      NODE_ENV: test
      PERFORMANCE_PORT: 3180
      BASE_URL: http://127.0.0.1:3180/api
      PERF_REPORT_MONTH: 2026-03
      PERF_SEARCH_DATE: 2026-03-15
      PERF_SEARCH_TIME: 10:00
      PERF_ADMIN_ID: 11111111-1111-1111-1111-111111111111
      PERF_ADMIN_EMAIL: admin.integration@bookit.test
      PERF_ADMIN_ROLE: ADMIN
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: grafana/setup-k6-action@v1

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:performance:seed
      - run: npm run build

      - name: Start performance app
        run: |
          mkdir -p performance-results
          nohup npm run start:performance:server > ../backend-performance.log 2>&1 &

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PERFORMANCE_PORT}/api" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-performance.log || true
          exit 1

      - name: Run k6 baseline
        run: npm run test:performance -- --summary-export ./performance-results/summary.json

      - name: Upload performance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-summary
          path: backend/performance-results/summary.json
          if-no-files-found: ignore

      - name: Upload performance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-manifest
          path: backend/test/performance/generated/manifest.json
          if-no-files-found: ignore

      - name: Upload performance server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-server-log
          path: backend-performance.log
          if-no-files-found: ignore

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: backend-performance
    if: ${{ needs.backend-performance.result == 'success' }}
    environment: Staging
    permissions:
      actions: read
      contents: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Checkout at validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build
          npm prune --omit=dev
          npx --yes prisma generate

      - name: Setup Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npm prune --omit=dev
        env:
          VITE_API_URL: ${{ secrets.DEPLOY_API_URL }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH || '/' }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure deploy directories exist on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST \
            "mkdir -p ~/BookIt/backend ~/BookIt/frontend ~/BookIt/deploy/nginx"

      - name: Copy backend to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/dist backend/node_modules backend/package.json backend/package-lock.json backend/prisma \
            $EC2_USER@$EC2_HOST:~/BookIt/backend/

      - name: Copy frontend to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist frontend/node_modules frontend/package.json frontend/package-lock.json frontend/serve.json \
            $EC2_USER@$EC2_HOST:~/BookIt/frontend/

      - name: Copy nginx security config to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy/nginx/ \
            $EC2_USER@$EC2_HOST:~/BookIt/deploy/nginx/

      - name: Restart services on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -f /swapfile ]; then
              echo "Adding 2GB swap for free-tier EC2..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap added."
            fi

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use default

            sudo mkdir -p /etc/nginx/conf.d
            sudo cp ~/BookIt/deploy/nginx/bookit-security-headers.conf /etc/nginx/conf.d/bookit-security-headers.conf
            sudo nginx -t
            sudo systemctl reload nginx

            cd ~/BookIt/backend
            pm2 delete bookit-api 2>/dev/null || true
            SUPPRESS_PERF_BOOKING_EMAILS="true" PERF_BOOKING_PREFIX="${{ secrets.PERF_BOOKING_PREFIX }}" CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}" PORT=5173 pm2 start dist/src/main.js --name bookit-api

            cd ~/BookIt/frontend
            pm2 delete bookit-frontend 2>/dev/null || true
            pm2 start "npx serve --config serve.json dist -l 3000" --name bookit-frontend

            pm2 save
            echo "Deploy complete."

  hosted-staging-performance:
    name: Performance Staging (Hosted)
    needs: deploy
    uses: ./.github/workflows/performance-staging.yml
    with:
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
    secrets: inherit

  dast:
    name: OWASP ZAP (DAST)
    needs: hosted-staging-performance
    uses: ./.github/workflows/dast.yml
    with:
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
    secrets: inherit
