name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.DEPLOY_API_URL || 'http://localhost:3000' }}
      - run: npm test

      - name: Upload frontend build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/package.json
            frontend/package-lock.json

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Upload backend build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/prisma

  merge-artifacts:
    name: Merge build artifacts for deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()
    needs: [frontend, backend]
    steps:
      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-build

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Upload combined deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: |
            backend-build
            frontend-build
          merge-multiple: true
