name: OWASP ZAP (DAST)

on:
  workflow_run:
    workflows: ["Performance Staging (Hosted)"]
    types: [completed]

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: Staging
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan - Frontend
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "${{ secrets.CORS_ORIGIN }}"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-frontend

      - name: ZAP Baseline Scan - Backend API
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "${{ secrets.DEPLOY_API_URL }}/api"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-backend
