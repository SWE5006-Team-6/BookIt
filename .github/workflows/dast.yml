name: OWASP ZAP (DAST)

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or SHA to scan
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to scan
        required: true
        type: string
        default: main

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: ZAP Baseline Scan - Frontend
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "${{ secrets.CORS_ORIGIN }}"
          rules_file_name: ".zap/rules-frontend.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-frontend

      - name: ZAP Baseline Scan - Backend API
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "${{ secrets.DEPLOY_API_URL }}/api"
          rules_file_name: ".zap/rules-backend.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-backend
