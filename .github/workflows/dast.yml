name: DAST (OWASP ZAP)

on:
  workflow_run:
    workflows: ["Deploy to EC2"]
    types: [completed]
    branches: [main]

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan - Frontend
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://${{ secrets.EC2_HOST }}:3000"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-frontend

      - name: ZAP Baseline Scan - Backend API
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://${{ secrets.EC2_HOST }}:5173"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-backend
